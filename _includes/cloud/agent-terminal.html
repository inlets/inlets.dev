<!-- Self-contained "agent" terminal animation: a mocked assistant that stands up
     a public HTTPS endpoint with Inlets Cloud, headless, end to end. Vanilla JS,
     no dependencies. Ported from the state-machine pattern used on slicervm.com. -->
<div id="agent-terminal" class="relative w-full max-w-full">
  <div class="bg-white rounded-lg overflow-hidden shadow-lg border border-gray-200 w-full max-w-full">
    <div class="bg-gray-100 px-4 py-2 flex items-center gap-2 border-b border-gray-200">
      <div class="flex gap-2">
        <div class="w-3 h-3 rounded-full bg-red-500"></div>
        <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
        <div class="w-3 h-3 rounded-full bg-green-500"></div>
      </div>
      <div class="flex-1 text-center text-xs font-mono text-gray-500">agent · inlets cloud</div>
      <button type="button" id="agent-terminal-replay" class="hidden sm:inline-flex items-center justify-center h-6 w-6 rounded-md border border-gray-300 bg-gray-50 text-gray-600 hover:bg-gray-200" title="Replay" aria-label="Replay animation">
        <svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" /></svg>
      </button>
    </div>
    <div id="agent-terminal-body" class="agent-terminal-scroll h-72 sm:h-80 w-full overflow-y-auto overflow-x-hidden p-3 sm:p-4 bg-white">
      <div id="agent-terminal-lines" class="font-mono text-xs sm:text-sm space-y-1 min-h-full"></div>
    </div>
  </div>
</div>

<style>
  #agent-terminal .agent-cursor {
    display: inline-block;
    width: 0.5rem;
    height: 1rem;
    margin-left: 0.125rem;
    vertical-align: middle;
    background: #334155;
    animation: agent-blink 1s steps(2, start) infinite;
  }
  @keyframes agent-blink { to { visibility: hidden; } }
  #agent-terminal .agent-terminal-scroll { scrollbar-width: thin; scrollbar-color: #cbd5e1 #f1f5f9; }
  #agent-terminal .agent-terminal-scroll::-webkit-scrollbar { width: 8px; }
  #agent-terminal .agent-terminal-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
  #agent-terminal .agent-terminal-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  #agent-terminal .agent-terminal-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  #agent-terminal .agent-result { white-space: pre-wrap; }
  @media (prefers-reduced-motion: reduce) {
    #agent-terminal .agent-cursor { animation: none; }
  }
</style>

<script>
(function () {
  var body = document.getElementById('agent-terminal-body');
  var lines = document.getElementById('agent-terminal-lines');
  var replay = document.getElementById('agent-terminal-replay');
  if (!body || !lines) return;

  // A mocked agent session. One prompt, then the agent stands up a public HTTPS
  // endpoint with Inlets Cloud and hands back the link. Generated tunnel name and
  // the cambs1 (EU) region mirror a real Inlets Cloud run.
  var sequence = [
    { type: 'user', text: "Stand up a public HTTPS endpoint for the app on :8080 with inlets cloud, then send me the link.", delay: 700 },
    { type: 'tool', text: "Bash(inlets-pro cloud create kotori --region cambs1)", delay: 260 },
    { type: 'result', lines: ["Created tunnel \"kotori\" · region cambs1 (EU · London)"], delay: 380 },
    { type: 'tool', text: "Bash(inlets-pro cloud connect kotori --upstream http://127.0.0.1:8080)", delay: 320 },
    { type: 'result', lines: ["inlets client connected · TLS certificate issued", "tunnel online"], delay: 420 },
    { type: 'tool', text: "Bash(inlets-pro cloud ls)", delay: 260 },
    { type: 'result', lines: ["kotori   cambs1   online", "→ https://kotori.cambs1.tryinlets.dev"], delay: 460 },
    { type: 'tool', text: "Bash(curl -s -o /dev/null -w '%{http_code}' https://kotori.cambs1.tryinlets.dev)", delay: 320 },
    { type: 'result', lines: ["200"], delay: 360 },
    { type: 'agent', text: "Live at https://kotori.cambs1.tryinlets.dev with a valid HTTPS certificate, and not a single inbound port opened on your network.", delay: 700 },
    { type: 'done', text: "✓ Prompt to public URL in 9s. No firewall changes, no cloud console.", delay: 9000 }
  ];

  var timers = [];
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function scrollDown() { body.scrollTop = body.scrollHeight; }

  function renderTool(text) {
    var paren = text.indexOf('(');
    var name = paren > 0 ? text.slice(0, paren) : text;
    var args = paren > 0 ? text.slice(paren) : '';
    var row = el('div', 'flex items-start gap-2 pt-1.5');
    row.appendChild(el('span', 'text-indigo-600 leading-relaxed', '&#9679;'));
    row.appendChild(el('span', 'break-all leading-relaxed',
      '<span class="font-semibold text-gray-900">' + esc(name) + '</span>' +
      '<span class="text-gray-600">' + esc(args) + '</span>'));
    return row;
  }
  function renderResult(resLines) {
    var wrap = el('div', 'pl-4');
    resLines.forEach(function (line) {
      var row = el('div', 'flex items-start gap-1.5');
      row.appendChild(el('span', 'text-gray-400', '&#9151;'));
      row.appendChild(el('span', 'agent-result text-gray-500 break-all leading-relaxed', esc(line)));
      wrap.appendChild(row);
    });
    return wrap;
  }
  function renderAgent(text) {
    return el('p', 'text-gray-800 leading-relaxed pt-2 break-words', esc(text));
  }
  function renderDone(text) {
    return el('p', 'text-green-700 font-medium leading-relaxed pt-2', esc(text));
  }

  function typeUser(step, done) {
    var row = el('div', 'flex items-start gap-2');
    row.appendChild(el('span', 'text-indigo-600 font-bold', '&gt;'));
    var textEl = el('span', 'text-gray-900 break-words leading-relaxed');
    var cursor = el('span', 'agent-cursor');
    textEl.appendChild(cursor);
    row.appendChild(textEl);
    lines.appendChild(row);
    scrollDown();

    var full = step.text, i = 0;
    (function tick() {
      if (i < full.length) {
        cursor.insertAdjacentText('beforebegin', full[i]);
        i++;
        scrollDown();
        later(tick, 8 + Math.random() * 9);
      } else {
        textEl.removeChild(cursor);
        later(done, step.delay);
      }
    })();
  }

  function reducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function renderStatic() {
    clearTimers();
    lines.innerHTML = '';
    sequence.forEach(function (step) {
      if (step.type === 'user') {
        var row = el('div', 'flex items-start gap-2');
        row.appendChild(el('span', 'text-indigo-600 font-bold', '&gt;'));
        row.appendChild(el('span', 'text-gray-900 break-words leading-relaxed', esc(step.text)));
        lines.appendChild(row);
      } else if (step.type === 'tool') lines.appendChild(renderTool(step.text));
      else if (step.type === 'result') lines.appendChild(renderResult(step.lines));
      else if (step.type === 'agent') lines.appendChild(renderAgent(step.text));
      else if (step.type === 'done') lines.appendChild(renderDone(step.text));
    });
    scrollDown();
  }

  function play() {
    clearTimers();
    lines.innerHTML = '';
    var idx = 0;
    function next() {
      if (idx >= sequence.length) { later(play, 0); return; }
      var step = sequence[idx++];
      if (step.type === 'user') { typeUser(step, next); return; }
      if (step.type === 'tool') lines.appendChild(renderTool(step.text));
      else if (step.type === 'result') lines.appendChild(renderResult(step.lines));
      else if (step.type === 'agent') lines.appendChild(renderAgent(step.text));
      else if (step.type === 'done') lines.appendChild(renderDone(step.text));
      scrollDown();
      later(next, step.delay);
    }
    next();
  }

  if (replay) replay.addEventListener('click', function () { if (!reducedMotion()) play(); });

  // Only run when scrolled into view; pause when off-screen to save cycles.
  var started = false;
  function start() {
    if (started) return;
    started = true;
    if (reducedMotion()) renderStatic(); else play();
  }
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { start(); io.disconnect(); } });
    }, { threshold: 0.25 });
    io.observe(document.getElementById('agent-terminal'));
  } else {
    start();
  }
})();
</script>
